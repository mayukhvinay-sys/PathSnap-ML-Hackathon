# Search spaces for Optuna TPE. Objective: maximise 5-fold GroupKFold (by trip) macro-F1 on the 80 training trips.
# Student-test and evaluator-test data are never used here.
hgb:
  name: HistGradientBoosting
  family: boosting
  params:
    learning_rate:     {type: float, low: 0.01, high: 0.3, log: true}
    max_iter:          {type: int,   low: 100,  high: 500}
    max_leaf_nodes:    {type: int,   low: 15,   high: 127}
    max_depth:         {type: int,   low: 3,    high: 12}
    min_samples_leaf:  {type: int,   low: 20,   high: 300}
    l2_regularization: {type: float, low: 1.0e-6, high: 10.0, log: true}
    max_bins:          {type: categorical, choices: [63, 127, 255]}
  fixed: {early_stopping: false}
lgbm:
  name: LightGBM
  family: boosting
  params:
    learning_rate:     {type: float, low: 0.01, high: 0.3, log: true}
    n_estimators:      {type: int,   low: 100,  high: 500}
    num_leaves:        {type: int,   low: 15,   high: 127}
    max_depth:         {type: int,   low: 3,    high: 12}
    min_child_samples: {type: int,   low: 20,   high: 300}
    reg_lambda:        {type: float, low: 1.0e-6, high: 10.0, log: true}
    subsample:         {type: float, low: 0.6,  high: 1.0}
    colsample_bytree:  {type: float, low: 0.6,  high: 1.0}
  fixed: {verbosity: -1, subsample_freq: 1}
rf:
  name: RandomForest
  family: ensemble
  params:
    n_estimators:      {type: int,   low: 100,  high: 400}
    max_depth:         {type: int,   low: 6,    high: 30}
    min_samples_leaf:  {type: int,   low: 1,    high: 30}
    max_features:      {type: float, low: 0.4,  high: 1.0}
  fixed: {n_jobs: -1}
