# Raw data root (read-only, not committed). Edit if your folder is elsewhere.
data_root: "../Student folder"
partitions:
  train: train
  student_test: student_test
processed_dir: data/processed
seed: 42
# Trips are spread across Europe: each trip is projected with its own local
# azimuthal equidistant projection (WGS84) centred on its GPS track, in metres.
crs_metric: "local aeqd per trip"
